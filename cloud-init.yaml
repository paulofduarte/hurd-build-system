#cloud-config
#
# Bootstrap a Linux VM (orbstack-style) for nix-based dev work on
# this project.  System-wide setup — every user gets the same tools,
# the same shell hooks, the same direnv config.  Robust to orbstack's
# late-stage user provisioning (the host-matching user is created
# after cloud-init in some configurations).
#
# Layout this script lays down:
#
#   /nix/var/nix/profiles/system-tools/   nix profile holding cachix,
#                                         direnv, nix-direnv, starship.
#                                         Kept separate from `default/`
#                                         so the Determinate Nix daemon
#                                         can manage its own profile
#                                         without our packages on top.
#   /etc/profile.d/nix-system-tools.sh    Adds system-tools/bin to PATH,
#                                         sets TERM, points direnv at
#                                         /etc/direnv, and (for
#                                         interactive shells only) wires
#                                         direnv + starship hooks.
#                                         /etc/profile.d/* is sourced
#                                         by login shells (orb -m vm);
#                                         /etc/bash.bashrc would catch
#                                         non-login interactive shells
#                                         on Ubuntu but isn't loaded
#                                         for login shells, so the
#                                         hooks live here instead and
#                                         guard themselves with `$-`.
#   /etc/direnv/direnvrc                  System direnv plugin file —
#                                         sources nix-direnv.
#   /etc/direnv/direnv.toml               System direnv settings;
#                                         hides the env-diff banner.
#
# For emulated VMs (orbstack x86_64 on aarch64 host via rosetta), the
# script auto-detects rosetta and disables nix's seccomp BPF filter,
# which the emulation layer can't honour.  Native VMs keep the filter.
#
# Apply: `orb create ubuntu my-vm --user-data cloud-init.yaml`.
#
# Debug:
#   orb shell my-vm
#   sudo cloud-init status --long            # current state + reason
#   sudo cat /var/log/cloud-init.log         # full init log
#   sudo cat /var/log/cloud-init-output.log  # stdout/stderr from runcmd
#
# Why write_files + runcmd: cloud-init runs `runcmd` items under
# /bin/sh (dash on Ubuntu), which rejects `set -o pipefail`.  We write
# the script with a bash shebang and exec it from runcmd so pipefail
# works for the `curl … | sh` install line.

write_files:
  - path: /usr/local/sbin/bootstrap-nix-dev.sh
    permissions: '0755'
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      NIX=/nix/var/nix/profiles/default/bin/nix
      SYSTEM_PROFILE=/nix/var/nix/profiles/system-tools

      # ---- 1. Install nix (multi-user, daemon-managed) ----
      EXTRA=(
        --extra-conf "experimental-features = nix-command flakes"
        # @sudo on Debian/Ubuntu, @wheel on RHEL/Fedora/Arch — list
        # both so this YAML works across distros.
        --extra-conf "trusted-users = @sudo @wheel"
        # Pre-trust the project's cachix cache + auto-accept flake
        # nixConfig.  Together these make `nix develop` on the project
        # flow through without the "do you want to allow this
        # extra-substituter?" prompt (which non-interactive callers
        # like direnv can't answer and would hang on).  The substituter
        # entries match the flake's nixConfig; `accept-flake-config`
        # opts into any flake's nixConfig declaration on this VM
        # (acceptable for a single-purpose dev box).
        --extra-conf "accept-flake-config = true"
        --extra-conf "extra-substituters = https://hurd-build-system.cachix.org"
        --extra-conf "extra-trusted-public-keys = hurd-build-system.cachix.org-1:dJ/avTKQFMBKT8halHXN+hN/4Dg5oP++Uz/goz4fZSE="
      )
      # Detect when we're running under emulation.  orbstack registers
      # rosetta as a binfmt_misc handler in *both* directions:
      #   - on an x86_64 VM (the rosetta marker is THE emulator)
      #   - on an aarch64 VM (so x86_64 binaries inside the otherwise-
      #     native VM can still run via rosetta translation)
      # Only the first case actually needs filter-syscalls disabled
      # — the second has a fully native aarch64 kernel that supports
      # seccomp BPF normally.  Check `uname -m` to disambiguate.
      if [ "$(uname -m)" = "x86_64" ] && [ -e /proc/sys/fs/binfmt_misc/rosetta ]; then
        EXTRA+=(--extra-conf "filter-syscalls = false")
      fi
      curl --proto '=https' --tlsv1.2 -sSf -L https://install.determinate.systems/nix \
        | sh -s -- install linux --no-confirm "${EXTRA[@]}"

      # ---- 2. Install dev tooling into a dedicated system profile ----
      # Keeping these in their own profile (not `default/`) means the
      # Determinate Nix daemon's profile upgrades don't fight with our
      # packages.  Running as root with no `--profile` would default
      # to the per-user profile of whoever invoked cloud-init (root),
      # which isn't what we want either.
      "$NIX" --extra-experimental-features 'nix-command flakes' \
        profile add \
          --profile "$SYSTEM_PROFILE" \
          nixpkgs#cachix \
          nixpkgs#direnv \
          nixpkgs#nix-direnv \
          nixpkgs#starship

      # ---- 3. /etc/profile.d entry — PATH + TERM + DIRENV_CONFIG ----
      # Sourced by /etc/profile for every login shell on every account.
      # DIRENV_CONFIG points direnv at /etc/direnv/ so the system-wide
      # direnvrc + direnv.toml are picked up automatically.
      cat > /etc/profile.d/nix-system-tools.sh <<'PROFILED'
      # System-wide tooling installed via Nix into
      # /nix/var/nix/profiles/system-tools (cachix, direnv, nix-direnv,
      # starship).  Provisioned by cloud-init at first boot.
      if [ -d /nix/var/nix/profiles/system-tools/bin ]; then
        export PATH="/nix/var/nix/profiles/system-tools/bin:$PATH"
      fi
      # Nix pure shells default TERM to "dumb"; force a sane default
      # so colour and TUI features keep working.
      export TERM="${TERM:-xterm-256color}"
      # direnv reads its config from $DIRENV_CONFIG/direnvrc — point
      # it at /etc/direnv/ so the nix-direnv plugin is picked up
      # system-wide.
      export DIRENV_CONFIG=/etc/direnv

      # Interactive-shell hooks.  Ubuntu sources /etc/profile.d/* for
      # *login* shells (e.g., `orb -m vm`) but NOT /etc/bash.bashrc —
      # so the direnv+starship init that lives there would be missed
      # by login shells without these copies.  Guarded by $- so we
      # don't try to attach a PROMPT_COMMAND to non-interactive
      # invocations (eg. systemd timers, cron, scripts).  Re-running
      # `eval $(direnv hook bash)` on a shell that already sourced
      # /etc/bash.bashrc is idempotent (just redefines _direnv_hook).
      case $- in
        *i*)
          if [ -n "${BASH_VERSION:-}" ]; then
            command -v direnv   >/dev/null 2>&1 && eval "$(direnv hook bash)"
            command -v starship >/dev/null 2>&1 && eval "$(starship init bash)"
          fi
          ;;
      esac
      PROFILED
      chmod 0644 /etc/profile.d/nix-system-tools.sh

      # ---- 4. System-wide direnv config (/etc/direnv) ----
      # /etc/profile.d/nix-system-tools.sh sets DIRENV_CONFIG to this
      # dir, so direnv picks up both files for every user.
      mkdir -p /etc/direnv
      cat > /etc/direnv/direnvrc <<'DIRENVRC'
      # Load nix-direnv from the system-tools profile.  Provides the
      # `use flake` / `use nix` direnv stdlib for nix projects.
      source /nix/var/nix/profiles/system-tools/share/nix-direnv/direnvrc
      DIRENVRC
      cat > /etc/direnv/direnv.toml <<'DIRENVTOML'
      [global]
      # Suppress the "direnv: export +VAR1 +VAR2 ..." banner on
      # every `cd` into a direnv-enabled project.
      hide_env_diff = true
      DIRENVTOML

runcmd:
  - /usr/local/sbin/bootstrap-nix-dev.sh
