#cloud-config
#
# Bootstrap a Linux VM (orbstack, AWS, GCP, libvirt, …) for nix-based
# dev work on this project.  System-wide setup — every user gets the
# same tools and shell hooks.  Robust to platforms that provision
# the host-matching user after cloud-init has run (orbstack does
# this on some configurations).
#
# Layout this script lays down:
#   /nix/var/nix/profiles/system-tools/    cachix, git, gnumake,
#                                          starship.
#   /etc/profile.d/nix-system-tools.sh     PATH + TERM + interactive
#                                          starship hook.
#
# Apply: `orb create ubuntu my-vm --user-data cloud-init.yaml`.
#
# Debug:
#   orb shell my-vm
#   sudo cloud-init status --long            # current state + reason
#   sudo cat /var/log/cloud-init.log         # full init log
#   sudo cat /var/log/cloud-init-output.log  # stdout/stderr from runcmd
#
# Why write_files + runcmd: cloud-init runs `runcmd` items under
# /bin/sh (dash on Ubuntu), which rejects `set -o pipefail`.  We write
# the script with a bash shebang and exec it from runcmd.

write_files:
  - path: /usr/local/sbin/bootstrap-nix-dev.sh
    permissions: '0755'
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      # Project's cachix cache.  Keep in sync with the nixConfig block
      # in flake.nix and the workflow under .github/workflows/.
      CACHIX_SUBSTITUTER="https://hurd-build-system.cachix.org"
      CACHIX_PUBLIC_KEY="hurd-build-system.cachix.org-1:dJ/avTKQFMBKT8halHXN+hN/4Dg5oP++Uz/goz4fZSE="

      NIX=/nix/var/nix/profiles/default/bin/nix
      SYSTEM_PROFILE=/nix/var/nix/profiles/system-tools

      # ---- 1. Install upstream nix (multi-user, daemon-managed) ----
      #
      # The upstream installer exposes two hooks for shipping a custom
      # /etc/nix/nix.conf as part of an automated provision:
      #
      #   $NIX_EXTRA_CONF     Merged into the nix.conf the installer
      #                       writes.  Use for settings that need to
      #                       be in nix.conf *after* the install:
      #                       substituters, trust lists, experimental
      #                       features, build limits, etc.
      #
      #   /etc/nix/nix.conf   Pre-existing file picked up by
      #   (pre-written)       nix-daemon when systemd first starts it
      #                       — earlier than the installer's own
      #                       nix.conf write.  Use for settings that
      #                       must take effect *during* the install.
      #                       The installer overwrites this file with
      #                       its merged version, so anything you
      #                       want to persist must also be in
      #                       $NIX_EXTRA_CONF.
      #
      # Both are upstream-nix features; no fork installer needed.
      NIX_EXTRA_CONF=$(printf '%s\n' \
        'experimental-features = nix-command flakes' \
        'trusted-users = @sudo @wheel' \
        'accept-flake-config = true' \
        "extra-substituters = ${CACHIX_SUBSTITUTER}" \
        "extra-trusted-public-keys = ${CACHIX_PUBLIC_KEY}")

      # Emulated x86_64 VMs (orbstack on an aarch64 host via rosetta)
      # need `filter-syscalls = false` in the daemon's effective
      # config from its very first start — the installer's bootstrap
      # step runs the daemon before writing its own nix.conf, and
      # rosetta can't honour seccomp BPF.  Pre-write nix.conf in that
      # case so the setting is live before the daemon starts.  Native
      # VMs keep the stricter default.
      #
      # `uname -m` disambiguates: orbstack registers the rosetta
      # binfmt_misc handler on aarch64 VMs too (for x86_64 binaries
      # inside an otherwise-native VM), and those don't need the
      # workaround.
      if [ "$(uname -m)" = "x86_64" ] && [ -e /proc/sys/fs/binfmt_misc/rosetta ]; then
        NIX_EXTRA_CONF="${NIX_EXTRA_CONF}
      filter-syscalls = false"

        mkdir -p /etc/nix
        printf '%s\n' "$NIX_EXTRA_CONF" > /etc/nix/nix.conf
        echo "build-users-group = nixbld" >> /etc/nix/nix.conf
      fi

      # Process substitution `<(curl …)` rather than `curl … | sh`:
      # the pipe form would clobber sh's stdin (the script body) with
      # /dev/null and curl would fail.  HOME because the installer
      # bails out without it.
      NIX_EXTRA_CONF="$NIX_EXTRA_CONF" \
      HOME=/root \
        sh <(curl --proto '=https' --tlsv1.2 -sSf -L https://nixos.org/nix/install) \
          --daemon --no-channel-add </dev/null

      # ---- 2. Install dev tooling into a dedicated system profile ----
      # Separate from `default/` (the nix-daemon's own profile for the
      # nix binary itself) so daemon-managed actions like
      # `nix upgrade-nix` don't conflict with user tooling.
      "$NIX" --extra-experimental-features 'nix-command flakes' \
        profile add \
          --profile "$SYSTEM_PROFILE" \
          nixpkgs#cachix \
          nixpkgs#git \
          nixpkgs#gnumake \
          nixpkgs#starship

      # ---- 3. /etc/profile.d entry — PATH + TERM + starship hook ----
      # /etc/profile sources /etc/profile.d/* for every login shell.
      # Ubuntu's /etc/bash.bashrc only covers non-login interactive
      # shells, so login shells (e.g. `orb -m vm`) would miss hooks
      # added there.  Putting everything here with a `case $-`
      # interactive guard covers both.
      cat > /etc/profile.d/nix-system-tools.sh <<'PROFILED'
      if [ -d /nix/var/nix/profiles/system-tools/bin ]; then
        export PATH="/nix/var/nix/profiles/system-tools/bin:$PATH"
      fi
      # Nix pure shells default TERM to "dumb" — force a sane default.
      export TERM="${TERM:-xterm-256color}"

      case $- in
        *i*)
          if [ -n "${BASH_VERSION:-}" ]; then
            command -v starship >/dev/null 2>&1 && eval "$(starship init bash)"
          fi
          ;;
      esac
      PROFILED
      chmod 0644 /etc/profile.d/nix-system-tools.sh

runcmd:
  - /usr/local/sbin/bootstrap-nix-dev.sh
