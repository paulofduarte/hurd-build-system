name: Set up nix
description: Install nix (flakes on) with the project cachix cache as a pull substituter.
runs:
  using: composite
  steps:
    # v31+ ships nix 2.30.x, which understands the `inputs.self.submodules`
    # flake attribute this project relies on (v30 and earlier reject it).
    #
    # NIX_VOLUME_FS makes the darwin installer create a CASE-SENSITIVE /nix volume
    # (the official create-darwin-volume.sh passes it straight to `diskutil apfs
    # addVolume`, and sets up the /nix firmlink itself).  Needed because glibc's htl
    # subdir emits objects differing only in case (stamp.os vs stamp.oS), which
    # collide on the runners' default case-INSENSITIVE APFS and break the build at
    # htl/subdir_lib.  Harmless on Linux (no APFS volume created).  Local dev already
    # uses a case-sensitive /nix volume.
    - uses: cachix/install-nix-action@v31
      env:
        NIX_VOLUME_FS: Case-sensitive APFS
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
          accept-flake-config = true
          extra-substituters = https://hurd-build-system.cachix.org
          extra-trusted-public-keys = hurd-build-system.cachix.org-1:dJ/avTKQFMBKT8halHXN+hN/4Dg5oP++Uz/goz4fZSE=
    # Hard guarantee: every CI nix install goes through this action, so assert here
    # that the /nix volume - where nix runs its build sandboxes - is genuinely
    # case-sensitive, and fail fast otherwise.  Stops the glibc htl case-collision
    # (stamp.os vs stamp.oS) from ever silently returning if a future installer or
    # runner image stops honouring NIX_VOLUME_FS.  macOS only: Linux filesystems are
    # always case-sensitive.  diskutil reports the volume's FS personality directly
    # (no write into the root-owned store needed).
    - name: Assert /nix is case-sensitive (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        if diskutil info /nix | grep -qiE 'Case-sensitive'; then
          echo "/nix volume is case-sensitive."
        else
          echo "::error::/nix is NOT case-sensitive - glibc's htl build (stamp.os vs"
          echo "::error::stamp.oS) will collide.  NIX_VOLUME_FS not honoured by the"
          echo "::error::installer?"
          diskutil info /nix | grep -iE 'Personality|Name \(User Visible\)' || true
          exit 1
        fi
