name: Debug macOS glibc
# TEMPORARY diagnostic: build hurd-stubs (which rebuilds the uncached glibc
# stub-base from source) on the GitHub macOS runners with -L, so the full glibc
# build log - including the htl/subdir_lib failure that breaks `make dist` on
# darwin - streams to the Actions log where it can be read.  Remove once the
# macOS glibc compile is fixed.
on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up nix
        uses: ./.github/actions/setup-nix
      - name: Build hurd-stubs (full streamed log)
        run: nix build .#hurd-stubs-x86_64 -L
