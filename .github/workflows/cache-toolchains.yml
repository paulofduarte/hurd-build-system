name: Cache cross-toolchains

# Populate the cachix cache with each target's cross-toolchain
# (`packages.<host>.cross-gcc-<arch>` - the from-source compiler whose build
# closure spans the whole bootstrap chain: binutils -> bootstrap-gcc -> glibc ->
# cross-gcc + runtime).  We deliberately do NOT build mig /
# gnumach-headers / the kernel: those are cheap once the toolchain is cached,
# and their source changes wouldn't retrigger this workflow anyway (the
# sanity-check builds them).
#
# A `plan` job first cross-evaluates every (host x target) toolchain path and
# probes cachix (no download - just the .narinfo), so a host whose toolchains
# are all cached spins NO runner.  `populate` then builds only the missing
# (host, target) pairs and pushes them.
#
# Triggered only by changes that can alter toolchain derivation hashes.  Each
# host builds its own native view (hashes differ per host).

on:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - target-archs.nix
      - flakes/cross-toolchain/**/*.nix
      - packages.nix
      - .github/workflows/cache-toolchains.yml
      - .github/actions/setup-nix/action.yml
  workflow_dispatch:

# A newer commit supersedes an in-flight run - we only care about the cache
# reflecting the latest main.
concurrency:
  group: cache-toolchains-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide which (host, target) toolchains are missing from cachix.  Cross-eval
  # is pure, so one ubuntu runner computes every host's paths; `path-info
  # --store` is a no-download presence probe.  Emits a `populate` matrix of only
  # the hosts with missing targets, and a build-plan artifact the sanity-check
  # reads to decide whether to run at all.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up nix
        uses: ./.github/actions/setup-nix

      - name: Plan - probe cachix for each (host, target) toolchain
        id: plan
        run: |
          set -euo pipefail
          # Single source of truth for the build matrix: runner <-> nix system.
          hosts='[
            {"runner":"ubuntu-latest","system":"x86_64-linux"},
            {"runner":"ubuntu-24.04-arm","system":"aarch64-linux"},
            {"runner":"macos-latest","system":"aarch64-darwin"},
            {"runner":"macos-15-intel","system":"x86_64-darwin"}
          ]'
          cache=https://hurd-build-system.cachix.org

          include='[]'
          n=$(echo "$hosts" | jq length)
          for i in $(seq 0 $((n - 1))); do
            row=$(echo "$hosts" | jq -c ".[$i]")
            sys=$(echo "$row" | jq -r .system)
            echo "::group::probe $sys"
            # target -> cross-gcc outPath for this host (one cross-eval).  "cross-gcc-"
            # is 10 chars, like the old "toolchain-"; cross-binutils-* doesn't match.
            # shellcheck disable=SC2016  # ${n} is Nix, not bash - must not expand
            map=$(nix eval --json ".#packages.$sys" --apply '
              pkgs:
              let names = builtins.filter
                    (n: builtins.substring 0 10 n == "cross-gcc-")
                    (builtins.attrNames pkgs);
              in builtins.listToAttrs (map
                   (n: { name = builtins.substring 10 (-1) n; value = pkgs.${n}.outPath; })
                   names)')
            missing=""
            for t in $(echo "$map" | jq -r 'keys[]'); do
              p=$(echo "$map" | jq -r --arg t "$t" '.[$t]')
              if nix path-info --store "$cache" "$p" >/dev/null 2>&1; then
                echo "  cached   $sys/$t"
              else
                echo "  MISSING  $sys/$t"
                missing="$missing $t"
              fi
            done
            echo "::endgroup::"
            missing=$(echo "$missing" | xargs || true)
            if [ -n "$missing" ]; then
              include=$(echo "$include" \
                | jq -c --argjson r "$row" --arg t "$missing" '. + [$r + {targets: $t}]')
            fi
          done

          matrix=$(jq -cn --argjson inc "$include" '{include: $inc}')
          {
            echo "matrix=$matrix"
            [ "$(echo "$include" | jq length)" -gt 0 ] && echo "any=true" || echo "any=false"
          } >> "$GITHUB_OUTPUT"
          printf '%s\n' "$include" > build-plan.json

          {
            echo "## Toolchain cache plan"
            echo
            if [ "$(echo "$include" | jq length)" -gt 0 ]; then
              echo "$include" | jq -r '.[] | "- **\(.system)** -> build `\(.targets)`"'
            else
              echo "All toolchains already cached - no build jobs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The sanity-check downloads this to gate itself: empty plan -> nothing was
      # rebuilt -> the toolchains are unchanged and don't need re-checking.
      - name: Upload build plan
        uses: actions/upload-artifact@v7
        with:
          name: build-plan
          path: build-plan.json
          retention-days: 14

  populate:
    needs: plan
    if: ${{ needs.plan.outputs.any == 'true' }}
    name: ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    # Cross-GCC source bootstraps run ~30 min on the slower runners; leave room.
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up nix
        uses: ./.github/actions/setup-nix

      - name: Configure cachix push
        uses: cachix/cachix-action@v17
        with:
          name: hurd-build-system
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Don't re-push paths already on cache.nixos.org - keeps the free-tier
          # footprint to just our cross-toolchains.
          skipPush: false

      - name: Build missing toolchains
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          set -euo pipefail
          # Only the targets `plan` found missing for this host - cached ones are
          # skipped, so we never download a closure just to re-push nothing.
          for t in $TARGETS; do
            echo "::group::nix build .#cross-gcc-$t"
            nix build ".#cross-gcc-$t" --no-link --print-out-paths
            echo "::endgroup::"
          done
