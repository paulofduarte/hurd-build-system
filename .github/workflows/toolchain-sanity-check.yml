name: Toolchain sanity check
# Cross-host toolchain consistency.  For every (host x target) it runs
# `make dist` and records the result; the `compare` job then gates PURELY on
# whether the hosts AGREE - not on whether the kernel source is correct:
#   * all build -> per-file dist hashes must be byte-identical (else drift = FAIL)
#   * all fail  -> normalised error signatures must match (consistent source
#                  bug, e.g. i686-xen htonl = PASS)
#   * otherwise -> divergence = FAIL
#
# Targets come from target-archs.nix (not hardcoded).  DISPATCHED by `Cache
# cross-toolchains` when that run actually (re)built >=1 toolchain - so the
# "only run when something changed" decision lives there, and a dispatch here
# always runs.  (Explicit dispatch, not a `workflow_run` trigger: that linking
# proved unreliable.)  Also runnable manually.  Pulls the toolchain from cachix
# rather than rebuilding it per host.
on:
  workflow_dispatch:
concurrency:
  group: toolchain-sanity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Derive the per-target matrix.  The "only when something changed" gate now lives
  # in the cache workflow (it dispatches this only when it actually rebuilt >=1
  # toolchain), so when this runs, it runs in full.
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      arches: ${{ steps.arches.outputs.arches }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up nix
        uses: ./.github/actions/setup-nix
      - name: Derive ARCH list
        id: arches
        run: |
          set -euo pipefail
          arches=$(nix eval --json --file target-archs.nix --apply builtins.attrNames)
          echo "Arches: $arches"
          echo "arches=$arches" >> "$GITHUB_OUTPUT"
  build:
    needs: setup
    name: ${{ matrix.runner.system }} -> ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - {name: ubuntu-latest, system: x86_64-linux}
          - {name: ubuntu-24.04-arm, system: aarch64-linux}
          - {name: macos-latest, system: aarch64-darwin}
          - {name: macos-15-intel, system: x86_64-darwin}
        arch: ${{ fromJSON(needs.setup.outputs.arches) }}
    runs-on: ${{ matrix.runner.name }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up nix
        uses: ./.github/actions/setup-nix
      # Capture the outcome without failing the job - `compare` owns pass/fail.
      # result.txt = HOST/ARCH + either STATUS=ok and per-file dist hashes, or
      # STATUS=fail and a normalised error signature.
      - name: Build dist + capture result
        env:
          ARCH: ${{ matrix.arch }}
          HOSTSYS: ${{ matrix.runner.system }}
        run: |
          set -uo pipefail
          res=result.txt
          { echo "HOST=$HOSTSYS"; echo "ARCH=$ARCH"; } > "$res"
          # All cores for speed: objects are order-independent, so success-path
          # hashes are unaffected.  -k makes the FAIL set complete and
          # core-count-independent (plain -j stops at the first error, reporting
          # only the jobs in-flight then); sort -u below handles ordering.  The
          # Makefile forwards these flags to the inner build.
          if make -j"$(getconf _NPROCESSORS_ONLN)" -k ARCH="$ARCH" dist > build.log 2>&1; then
            echo "STATUS=ok" >> "$res"
            # LC_ALL=C: stable path ordering across macOS/Linux locales (compare
            # reads it as a per-path map anyway; just keeps the artifact clean).
            ( cd dist && find "$ARCH" -type f -print0 | LC_ALL=C sort -z | xargs -0 shasum -a 256 ) >> "$res"
          else
            echo "STATUS=fail" >> "$res"
            # Normalise host-specific bits so the same failure yields the same
            # signature everywhere: workspace path, /nix/store hashes, source
            # line/col, and the outer make's error format (GNU make 4.x's
            # [Makefile:LINE: target] vs Apple make 3.81's [target]).
            grep -aE 'error:|Error [0-9]+|fatal:' build.log \
              | sed -E "s#${GITHUB_WORKSPACE}#WORKSPACE#g; s#/nix/store/[a-z0-9]{32}-#/nix/store/HASH-#g; s/:[0-9]+(:[0-9]+)?:/:L:/g; s/\[Makefile:L: /[/g" \
              | LC_ALL=C sort -u >> "$res"
          fi
          echo "::group::result ($HOSTSYS / $ARCH)"; cat "$res"; echo "::endgroup::"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: result-${{ matrix.runner.system }}-${{ matrix.arch }}
          path: result.txt
          retention-days: 14
  compare:
    name: Cross-host consistency (gate)
    needs: [setup, build]
    # Run even if some build jobs failed (results captured in artifacts); skip only
    # if setup itself failed.
    if: ${{ always() && needs.setup.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download all results
        uses: actions/download-artifact@v8
        with:
          path: results
          pattern: result-*
      - name: Compare across hosts - fail on divergence
        env:
          ARCHES: ${{ needs.setup.outputs.arches }}
        # No `| tee`: it would mask Python's exit (a pipeline's status is the
        # last command's).  Python writes the summary itself and exits non-zero.
        run: |
          python3 - <<'PYEOF'
          import json, os, glob, sys

          summary = open(os.environ.get("GITHUB_STEP_SUMMARY", os.devnull), "a")
          def out(s=""):
              print(s)
              summary.write(s + "\n")

          arches = json.loads(os.environ["ARCHES"])

          # Read every result.txt (content authoritative - avoids parsing the
          # artifact name).
          recs = {}  # (host, arch) -> (status, payload_lines)
          for f in glob.glob("results/*/result.txt"):
              host = arch = status = None
              payload = []
              for line in open(f):
                  line = line.rstrip("\n")
                  if line.startswith("HOST="):     host = line[5:]
                  elif line.startswith("ARCH="):    arch = line[5:]
                  elif line.startswith("STATUS="):  status = line[7:]
                  elif status is not None:          payload.append(line)
              if host and arch:
                  recs[(host, arch)] = (status, payload)

          hosts = sorted({h for (h, _) in recs})

          out("## Cross-host toolchain consistency")
          out()
          out("Pass = hosts **agree**, compared order-independently: identical "
              "per-file dist hashes when a target builds, or an identical error "
              "signature when it doesn't.  Gates toolchain consistency across "
              "hosts, not kernel correctness.")
          out()
          out(f"Hosts reporting: {', '.join(hosts) or '(none)'}")
          out()

          def hashmap(lines):
              # "<hash>  <path>" -> {path: hash} (order-independent)
              m = {}
              for ln in lines:
                  p = ln.split(None, 1)
                  if len(p) == 2:
                      m[p[1]] = p[0]
              return m

          diverged = False
          for arch in arches:
              present = {h: recs[(h, arch)] for h in hosts if (h, arch) in recs}
              missing = [h for h in hosts if h not in present]
              if not present:
                  out(f"### `{arch}` - [WARN] no results"); out(); diverged = True; continue

              statuses = {h: present[h][0] for h in present}
              allok   = all(s == "ok"   for s in statuses.values())
              allfail = all(s == "fail" for s in statuses.values())

              if allok:
                  maps = {h: hashmap(present[h][1]) for h in present}
                  ref = next(iter(maps.values()))
                  if all(m == ref for m in maps.values()):
                      out(f"### `{arch}` - [PASS] builds, byte-identical across "
                          f"{len(present)} host(s)")
                  else:
                      diverged = True
                      out(f"### `{arch}` - [FAIL] **builds DIFFER across hosts** "
                          f"(toolchain drift)")
                      out()
                      paths = sorted(set().union(*(set(m) for m in maps.values())))
                      out("| File | hash per host |")
                      out("| --- | --- |")
                      for p in paths:
                          vals = {h: maps[h].get(p, "-(absent)") for h in present}
                          if len(set(vals.values())) > 1:
                              det = "<br>".join(f"{h}=`{vals[h][:12]}`" for h in sorted(vals))
                              out(f"| `{p}` | {det} |")
              elif allfail:
                  sigs = {h: frozenset(present[h][1]) for h in present}
                  ref = next(iter(sigs.values()))
                  if all(s == ref for s in sigs.values()):
                      out(f"### `{arch}` - [PASS] fails identically on all "
                          f"{len(present)} host(s) (consistent - source issue, "
                          f"not toolchain)")
                  else:
                      diverged = True
                      out(f"### `{arch}` - [FAIL] **fails DIFFERENTLY across hosts** "
                          f"(toolchain drift)")
                      out()
                      for h in sorted(present):
                          out(f"<details><summary>{h}</summary>")
                          out(); out("```")
                          out("\n".join(present[h][1]))
                          out("```"); out("</details>")
              else:
                  diverged = True
                  out(f"### `{arch}` - [FAIL] **builds on some hosts, fails on "
                      f"others** (divergence): "
                      + ", ".join(f"{h}={s}" for h, s in sorted(statuses.items())))

              if missing:
                  out(f"  [WARN] missing host(s): {', '.join(missing)}")
              out()

          out("---")
          if diverged:
              out("**RESULT: [FAIL] divergence detected - failing the workflow.**")
              summary.close(); sys.exit(1)
          out("**RESULT: [PASS] all targets consistent across hosts.**")
          summary.close()
          PYEOF
