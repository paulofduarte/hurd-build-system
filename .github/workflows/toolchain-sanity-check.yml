name: Toolchain sanity check

# Cross-host toolchain consistency check.  For every (build host × target
# ARCH) combination it runs `make dist ARCH=<target>` and records the result,
# then a `compare` job decides pass/fail PURELY on whether the hosts AGREE —
# this validates the toolchains behave identically across hosts, NOT that the
# kernel source itself is correct:
#
#   * builds on all hosts   -> the per-file dist hashes must be byte-identical
#     across hosts.  Any difference = host-coupled toolchain drift = FAIL.
#   * fails on all hosts     -> the (normalised) build-error signature must be
#     identical across hosts.  Same error everywhere = a source issue, not a
#     toolchain one = PASS (e.g. the 32-bit i686-xen htonl bug).
#   * builds on some, fails on others, or errors differ -> divergence = FAIL.
#
# The target ARCH list is derived from target-archs.nix (not hardcoded), so a
# new target is picked up automatically.
#
# Trigger model: runs after `Cache cross-toolchains` completes (it does the
# path gating: flake.nix / flake.lock / target-archs.nix / flakes/cross-
# toolchain / its own file), plus manual dispatch.
#
# Dist outputs are not pushed to cachix; we consume the toolchain cache as a
# substituter (pull-only) so the cross-toolchain isn't rebuilt per host.

on:
  workflow_run:
    workflows: ["Cache cross-toolchains"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: toolchain-sanity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Derive the target ARCH list from target-archs.nix so the build matrix
  # isn't hardcoded.  Also the single place the success gate is applied.
  setup:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      arches: ${{ steps.arches.outputs.arches }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Derive ARCH list
        id: arches
        run: |
          set -euo pipefail
          arches=$(nix eval --json --file target-archs.nix --apply builtins.attrNames)
          echo "Arches: $arches"
          echo "arches=$arches" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    name: ${{ matrix.runner.system }} → ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - { name: ubuntu-latest,    system: x86_64-linux   }
          - { name: ubuntu-24.04-arm, system: aarch64-linux  }
          - { name: macos-latest,     system: aarch64-darwin }
          - { name: macos-15-intel,   system: x86_64-darwin  }
        arch: ${{ fromJSON(needs.setup.outputs.arches) }}
    runs-on: ${{ matrix.runner.name }}
    timeout-minutes: 60

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            extra-substituters = https://hurd-build-system.cachix.org
            extra-trusted-public-keys = hurd-build-system.cachix.org-1:dJ/avTKQFMBKT8halHXN+hN/4Dg5oP++Uz/goz4fZSE=

      # Build and capture the OUTCOME without failing the job: the pass/fail
      # decision belongs to `compare` (a consistent failure across hosts is a
      # PASS).  result.txt carries HOST/ARCH + either STATUS=ok and the
      # per-file dist hashes, or STATUS=fail and a normalised error signature
      # (/nix/store hashes + source line numbers stripped so it compares
      # across hosts).
      - name: Build dist + capture result
        env:
          ARCH: ${{ matrix.arch }}
          HOSTSYS: ${{ matrix.runner.system }}
        run: |
          set -uo pipefail
          res=result.txt
          { echo "HOST=$HOSTSYS"; echo "ARCH=$ARCH"; } > "$res"
          if make ARCH="$ARCH" dist > build.log 2>&1; then
            echo "STATUS=ok" >> "$res"
            ( cd dist && find "$ARCH" -type f -print0 | sort -z | xargs -0 shasum -a 256 ) >> "$res"
          else
            echo "STATUS=fail" >> "$res"
            grep -aE 'error:|Error [0-9]+|fatal:' build.log \
              | sed -E 's#/nix/store/[a-z0-9]{32}-#/nix/store/HASH-#g; s/:[0-9]+(:[0-9]+)?:/:L:/g' \
              | sort -u >> "$res"
          fi
          echo "::group::result ($HOSTSYS / $ARCH)"; cat "$res"; echo "::endgroup::"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: result-${{ matrix.runner.system }}-${{ matrix.arch }}
          path: result.txt
          retention-days: 14

  compare:
    name: Cross-host consistency (gate)
    needs: [setup, build]
    # Run even if some build jobs reported failures — those are captured in
    # the artifacts and compared.  Skip only if setup itself didn't run.
    if: ${{ always() && needs.setup.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download all results
        uses: actions/download-artifact@v8
        with:
          path: results
          pattern: result-*

      - name: Compare across hosts — fail on divergence
        env:
          ARCHES: ${{ needs.setup.outputs.arches }}
        run: |
          python3 - <<'PYEOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os, glob

          arches = json.loads(os.environ["ARCHES"])

          # Read every result.txt (content is authoritative — HOST/ARCH lines
          # avoid parsing dashes out of the artifact name).
          recs = {}  # (host, arch) -> (status, payload_tuple)
          for f in glob.glob("results/*/result.txt"):
              host = arch = status = None
              payload = []
              for line in open(f):
                  line = line.rstrip("\n")
                  if line.startswith("HOST="):     host = line[5:]
                  elif line.startswith("ARCH="):    arch = line[5:]
                  elif line.startswith("STATUS="):  status = line[7:]
                  elif status is not None:          payload.append(line)
              if host and arch:
                  recs[(host, arch)] = (status, tuple(payload))

          hosts = sorted({h for (h, _) in recs})

          print("## Cross-host toolchain consistency")
          print()
          print("Pass = hosts **agree** (identical dist hashes when it builds, "
                "or an identical error signature when it doesn't).  This gates "
                "toolchain consistency, not kernel correctness.")
          print()
          print(f"Hosts reporting: {', '.join(hosts) or '(none)'}")
          print()

          diverged = False
          for arch in arches:
              present = {h: recs[(h, arch)] for h in hosts if (h, arch) in recs}
              missing = [h for h in hosts if h not in present]
              if not present:
                  print(f"### `{arch}` — ⚠ no results"); print(); diverged = True; continue

              statuses = {h: present[h][0] for h in present}
              allok   = all(s == "ok"   for s in statuses.values())
              allfail = all(s == "fail" for s in statuses.values())

              if allok:
                  payloads = {present[h][1] for h in present}
                  if len(payloads) == 1:
                      print(f"### `{arch}` — ✅ builds, byte-identical across "
                            f"{len(present)} host(s)")
                  else:
                      diverged = True
                      print(f"### `{arch}` — ❌ **builds DIFFER across hosts** "
                            f"(toolchain drift)")
                      print()
                      # which files differ
                      per = {}  # path -> {host: hash}
                      for h, (_, pl) in present.items():
                          for ln in pl:
                              parts = ln.split(None, 1)
                              if len(parts) == 2:
                                  per.setdefault(parts[1], {})[h] = parts[0]
                      print("| File | hash per host |")
                      print("| --- | --- |")
                      for p, hh in sorted(per.items()):
                          if len(set(hh.values())) > 1:
                              det = "<br>".join(f"{h}=`{hh[h][:12]}…`" for h in sorted(hh))
                              print(f"| `{p}` | {det} |")
              elif allfail:
                  sigs = {present[h][1] for h in present}
                  if len(sigs) == 1:
                      print(f"### `{arch}` — ✅ fails identically on all "
                            f"{len(present)} host(s) (consistent — source issue, "
                            f"not toolchain)")
                  else:
                      diverged = True
                      print(f"### `{arch}` — ❌ **fails DIFFERENTLY across hosts** "
                            f"(toolchain drift)")
                      print()
                      for h in sorted(present):
                          print(f"<details><summary>{h}</summary>")
                          print()
                          print("```")
                          print("\n".join(present[h][1]))
                          print("```")
                          print("</details>")
              else:
                  diverged = True
                  print(f"### `{arch}` — ❌ **builds on some hosts, fails on "
                        f"others** (divergence): "
                        + ", ".join(f"{h}={s}" for h, s in sorted(statuses.items())))

              if missing:
                  print(f"  ⚠ missing host(s): {', '.join(missing)}")
              print()

          print("---")
          if diverged:
              print("**RESULT: ❌ divergence detected — failing the workflow.**")
              raise SystemExit(1)
          print("**RESULT: ✅ all targets consistent across hosts.**")
          PYEOF
